apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: k8s-demo
    spec:
      containers:
        - name: app
          image: ghcr.io/quintans/k8s-demo:3556f909e01a3abe73381382c44d3470e814e82b
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "3556f909e01a3abe73381382c44d3470e814e82b"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
