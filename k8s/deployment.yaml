apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: k8s-demo
    spec:
      containers:
        - name: app
          image: ghcr.io/quintans/k8s-demo:f71c4d05a4ab08d1ca093c63423eb5c843bb8e6d
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "30734bce4824c8b371ca646b2993cab055a11345"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
