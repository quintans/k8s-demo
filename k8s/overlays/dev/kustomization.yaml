apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - ../../base

replicas:
  - name: k8s-demo
    count: 1

images:
  - name: ghcr.io/quintans/k8s-demo
    newName: ghcr.io/quintans/k8s-demo
    newTag: b1e64dc95575356c748eef9f362fceff82647793

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: k8s-demo
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: APP_VERSION
                    value: "b1e64dc95575356c748eef9f362fceff82647793"
