apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - ../../base

replicas:
  - name: k8s-demo
    count: 1

images:
  - name: ghcr.io/quintans/k8s-demo
    newName: ghcr.io/quintans/k8s-demo
    newTag: f3e35f4f7a96b1aaa779b23380e7d1e541fe7ad9

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: k8s-demo
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: APP_VERSION
                    value: "f3e35f4f7a96b1aaa779b23380e7d1e541fe7ad9"
